name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable GitHub Pages (Actions source) if needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh api -X POST "repos/${{ github.repository }}/pages" -f build_type=workflow
          # Already enabled, or token cannot create the site: continue and let deploy report it.
          true

      - name: Fetch images from the Netlify copy
        run: bash scripts/fetch-images.sh

      - name: Assemble publish directory
        run: |
          mkdir -p publish/assets publish/img
          for f in index.html 404.html thanks.html robots.txt buildy-pixel.js CNAME .nojekyll; do
            cp "$f" publish/
          done
          cp -r assets/. publish/assets/
          cp -r img/. publish/img/
          for route in reviews support contact terms privacy; do
            mkdir -p "publish/$route"
            cp index.html "publish/$route/index.html"
          done

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish

      - id: deployment
        uses: actions/deploy-pages@v4
